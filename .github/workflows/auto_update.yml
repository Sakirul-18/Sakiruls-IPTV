name: Auto Update IPTV Playlists & Trackers

on:
  schedule:
    # Runs every hour at minute 0 (prevents GitHub rate-limiting/delays)
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual triggering from Actions tab

concurrency:
  group: iptv-tracker-update
  cancel-in-progress: true

jobs:
  update-all:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests; fi

      # --- RUN MASTER TRACKER SCRIPT ---
      - name: Run IPTV Playlist Tracker
        run: |
          python tracker.py
          # If you have scripts inside the script folder, run them here:
          # python script/your_script_name.py

      # --- COMMIT AND PUSH UPDATES ---
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add -A
          
          if git diff --staged --quiet; then
            echo "No changes detected across any script outputs."
          else
            git commit -m "auto: update playlists and tracker streams [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
