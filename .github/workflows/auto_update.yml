name: Auto Update IPTV Playlists & Trackers

on:
  schedule:
    # Runs every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual run anytime

concurrency:
  group: iptv-tracker-update
  cancel-in-progress: false

jobs:
  update-all:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests; fi

      # --- RUN MASTER TRACKER SCRIPT ---
      - name: Run IPTV Playlist Tracker
        run: python tracker.py

      # --- COMMIT ALL UPDATED FILES AT ONCE ---
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Captures all updated .m3u files or outputs
          git add -A
          
          if git diff --staged --quiet; then
            echo "No changes detected across any script outputs."
          else
            git commit -m "auto: update playlists and tracker streams [skip ci]"
            
            # Pull latest changes and rebase to avoid rejections from concurrent updates
            git pull origin main --rebase || echo "Rebase encountered an issue, proceeding..."
            
            git push origin main
          fi
