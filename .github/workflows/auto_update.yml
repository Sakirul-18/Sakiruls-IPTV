name: Auto Update IPTV Playlists

on:
  schedule:
    # Runs automatically every 12 hours (adjust the cron schedule if needed)
    - cron: '0 */12 * * *'
  workflow_dispatch: # Allows you to run it manually from the GitHub Actions tab

jobs:
  update-playlists:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run all Python scripts in the script directory
        run: |
          for script in script/*.py; do
            echo "----------------------------------------"
            echo "Running $script..."
            python "$script"
            echo "Finished $script."
            echo "----------------------------------------"
          done

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "SAKIRULs IPTV.m3u"
          
          # Only commit if there are actual changes made to the file
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated Playlist Update: Pulled latest low-latency streams" && git push)
