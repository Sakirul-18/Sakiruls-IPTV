name: Update IPTV Playlists

on:
  schedule:
    # Offset minutes to avoid peak queue times
    - cron: '7,37 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-playlists
  cancel-in-progress: false

jobs:
  update-playlists:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install FFmpeg for blackdetect & freezedetect filters
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # Persist iptv_cache.json without committing it to Git
      - name: Restore & Save IPTV Cache
        uses: actions/cache@v4
        with:
          path: iptv_cache.json
          key: iptv-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            iptv-cache-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Runs every .py file under script/, one after another
      - name: Run all update scripts
        id: run_scripts
        continue-on-error: true
        run: |
          set +e
          overall_status=0
          for script in script/*.py; do
            echo "::group::Running $script"
            python "$script"
            status=$?
            if [ $status -ne 0 ]; then
              echo "::error::$script failed with exit code $status"
              overall_status=1
            fi
            echo "::endgroup::"
          done
          exit $overall_status

      # Stage only generated .m3u / .m3u8 files, avoiding iptv_cache.json
      - name: Commit and push if anything changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Explicitly exclude cache files if not in .gitignore
          git add *.m3u *.m3u8 2>/dev/null || true
          
          if git diff --cached --quiet; then
            echo "No playlist changes to commit"
          else
            git pull --rebase origin main || true
            git commit -m "Auto-update playlists [skip ci]"
            git push
          fi

      # Surface a failed run in the Actions tab
      - name: Fail workflow if any script errored
        if: steps.run_scripts.outcome == 'failure'
        run: exit 1
