name: Update FanCode IPTV
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Prevents overlapping runs from racing each other and rejecting
# each other's pushes. If a run is still going when the next
# scheduled trigger fires, the new one waits instead of starting
# in parallel against a stale checkout.
concurrency:
  group: fancode-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python script/update_sports_Fancode.py
      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Re-sync with remote in case anything landed since checkout,
          # so push doesn't get rejected as non-fast-forward.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"

          git add "SAKIRULs IPTV.m3u"
          git status
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto update FanCode streams"
            git push
          fi
